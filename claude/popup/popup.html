<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20" />
    <h1>Polymarket Live Overlay</h1>
  </header>

  <form id="form" autocomplete="off">
    <input id="url" type="text" spellcheck="false" placeholder="polymarket.com/event/… or polymarket.us/event/…" aria-label="Polymarket market URL" />
    <div class="actions">
      <button type="submit" id="open" class="primary">Open overlay</button>
      <button type="button" id="window" class="secondary" title="Open in a separate always-available window">Window</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </form>

  <section class="row">
    <label for="alpha">Background opacity</label>
    <input id="alpha" type="range" min="0" max="1" step="0.02" />
    <span id="alphaVal" class="val"></span>
  </section>

  <section id="recentWrap" hidden>
    <h2>Recent</h2>
    <ul id="recent"></ul>
  </section>

  <footer>
    <button type="button" id="closeAll" class="link">Close overlays on this page</button>
    <span class="tip">Tip: right-click any Polymarket link → “Open in Polymarket overlay”.</span>
  </footer>
</body>
</html>
